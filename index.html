<!doctype html>

<html>
    <head>
        <meta charset="utf-8">

        <title>Bookmarklet Unofficial Website</title>

        <!-- Load external CSS styles -->
        <link rel="stylesheet" href="styles.css">
        
         <style>
        body {
            background-color: #daffb3;
        }
        </style>

    </head>

    <body>

        <h1 class="Main_title" style="color: #3385ff;">Bookmarklet Unofficial Website</h1>

        <div style="display: flex; align-items: center; gap: 8px;">
          <button onclick="copyText()">Add to Clipboard</button>
    
          <textarea id="myBox" readonly style="width: 100px; height: 40px; background-color: white; color: black; resize: none; overflow-x: auto; white-space: nowrap;">Hello World</textarea>
        </div>

        <script>
          function copyText() {
            const box = document.getElementById("myBox");
            box.select();
            navigator.clipboard.writeText(box.value);
            alert("Copied to clipboard!");
          }
        </script>


        
        <!-- Load external JavaScript -->
        <script src="scripts.js"></script>
        
    </body>

</html>
