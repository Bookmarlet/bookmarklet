<!doctype html>

<html>
    <head>
        <meta charset="utf-8">

        <title>Bookmarklet Unofficial Website</title>

        <!-- Load external CSS styles -->
        <link rel="stylesheet" href="styles.css">
        
         <style>
        body {
            background-color: #daffb3;
        }
        </style>

    </head>

    <body>

        <h1 class="Main_title" style="color: #3385ff;">Bookmarklet Unofficial Website</h1>

        <div style="display: flex; align-items: center; gap: 8px;" style="margin-top: 300px;">
          <!-- Text box: height matches the button, padding and line-height ensure alignment -->
          <textarea id="myBox" readonly style="width: 100px; height: 24px; padding: 2px 6px; box-sizing: border-box; font-family: sans-serif; font-size: 13px; line-height: 18px; background-color: white; color: black; resize: none; overflow-x: auto; white-space: nowrap; border: 1px solid #ccc; border-radius: 4px;">Hello World</textarea>
  
          <!-- Button: height matches the text box, using identical font settings -->
          <button onclick="copyText()" style="height: 24px; padding: 0px 12px; box-sizing: border-box; font-family: sans-serif; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background-color: #f0f0f0;">Add to Clipboard</button>
        </div>

        <script>
          function copyText() {
            const box = document.getElementById("myBox");
            box.select();
            navigator.clipboard.writeText(box.value);
            alert("Copied to clipboard!");
          }
        </script>


        
        <!-- Load external JavaScript -->
        <script src="scripts.js"></script>
        
    </body>

</html>
